name: Scan tokens
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scan.py
        env:
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
      - run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add signals.json auto_watchlist.txt scan_history.json banned.json unban.txt
          git diff --cached --quiet || (git commit -m "scan tokens" && git pull --rebase && git push)
