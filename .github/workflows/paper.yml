name: Paper trader
on:
  schedule:
    - cron: '52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python paper_trader.py forward
      - run: python paper_trader.py replay
      - run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add paper_state.json paper_forward.json paper_replay.json
          git diff --cached --quiet || (git commit -m "paper trader" && git pull --rebase && git push)
